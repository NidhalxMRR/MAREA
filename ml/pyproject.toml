[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "marea-ml"
version = "0.1.0"
description = "Machine learning module for sea-temperature forecasting and aquaculture early-warning systems"
readme = "README.md"
license = {text = "MIT"}
authors = [
  {name = "MAREA Team", email = "info@marea.local"}
]

requires-python = ">=3.11"

dependencies = [
  "numpy>=1.24.0",
  "pandas>=2.0.0",
  "matplotlib>=3.7.0",
  "scikit-learn>=1.3.0",
  "pyyaml>=6.0",
  "openpyxl>=3.1.0",
  "xlrd>=2.0.1",
  "jupyter>=1.0.0",
  "pytest>=7.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest-cov>=4.0.0",
  "black>=23.0.0",
  "flake8>=6.0.0",
  "mypy>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/marea-team/marea"
Repository = "https://github.com/marea-team/marea"

[tool.setuptools]
packages = ["marea_ml"]

[tool.setuptools.package-dir]
marea_ml = "src/marea_ml"

[tool.setuptools.package-data]
marea_ml = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "--cov=src/marea_ml --cov-report=term-missing"

[tool.black]
line-length = 100
target-version = ["py311"]
include = '\.pyi?$'

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
