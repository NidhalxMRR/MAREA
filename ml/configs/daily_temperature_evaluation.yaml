# Evaluation settings for the researcher-provided daily temperature profile.
# This is separate from data.yaml, which remains the future 15-minute IoT
# operational configuration.
dataset_id: "bizerte_temperature_series_v1"
sampling_frequency: "daily"
candidate_forecast_horizons_days: [1, 3, 7]

baselines:
  - "persistence"
  - "seasonal_persistence_365_days"

seasonal_persistence_lag_days: 365

# Descriptive groups only. These are not biological or aquaculture risk limits.
descriptive_upper_temperature_quantiles: [0.90, 0.95]
risk_temperature_threshold: null

evaluation_note: >-
  The raw source repeats exactly every 365 rows. Seasonal-persistence results
  demonstrate that deterministic structure and are not independent-year
  generalization evidence.
