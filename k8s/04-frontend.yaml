apiVersion: apps/v1
kind: Deployment
metadata:
  name: marea-frontend
  namespace: marea
  labels:
    app: marea-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: marea-frontend
  template:
    metadata:
      labels:
        app: marea-frontend
    spec:
      containers:
        - name: frontend
          image: marea-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "512Mi"
              cpu: "250m"
---
apiVersion: v1
kind: Service
metadata:
  name: marea-frontend-service
  namespace: marea
spec:
  ports:
    - port: 80
      targetPort: 80
  selector:
    app: marea-frontend
