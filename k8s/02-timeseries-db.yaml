apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: marea-db-pvc
  namespace: marea
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: marea-db
  namespace: marea
spec:
  serviceName: marea-db-service
  replicas: 1
  selector:
    matchLabels:
      app: marea-db
  template:
    metadata:
      labels:
        app: marea-db
    spec:
      containers:
        - name: timescaledb
          image: timescale/timescaledb:latest-pg16
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: marea-config
                  key: DATABASE_NAME
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: marea-config
                  key: DATABASE_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: marea-secret
                  key: DATABASE_PASSWORD
          volumeMounts:
            - name: db-data
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "2Gi"
              cpu: "1000m"
      volumes:
        - name: db-data
          persistentVolumeClaim:
            claimName: marea-db-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: marea-db-service
  namespace: marea
spec:
  ports:
    - port: 5432
      targetPort: 5432
  selector:
    app: marea-db
