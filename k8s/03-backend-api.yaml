apiVersion: apps/v1
kind: Deployment
metadata:
  name: marea-backend
  namespace: marea
  labels:
    app: marea-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: marea-backend
  template:
    metadata:
      labels:
        app: marea-backend
    spec:
      containers:
        - name: backend
          image: marea-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          env:
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: marea-config
                  key: NODE_ENV
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: marea-config
                  key: PORT
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: marea-secret
                  key: DATABASE_URL
          livenessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "1Gi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: marea-backend-service
  namespace: marea
spec:
  ports:
    - port: 5000
      targetPort: 5000
  selector:
    app: marea-backend
